<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="35%" style="stop-color:#0c2d5e"/>
      <stop offset="65%" style="stop-color:#1565a8"/>
      <stop offset="100%" style="stop-color:#2b8fd4"/>
    </linearGradient>
    <!-- Star shimmer -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <!-- Snow shimmer on peaks -->
    <linearGradient id="snowShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="40%" style="stop-color:#e8f4fd"/>
      <stop offset="100%" style="stop-color:#c8e6f5"/>
    </linearGradient>
    <!-- Mountain shadow -->
    <linearGradient id="mtnShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d2847"/>
      <stop offset="100%" style="stop-color:#1a4a7a"/>
    </linearGradient>
    <!-- Name glow -->
    <filter id="nameGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Aurora shimmer -->
    <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:0.08"/>
      <stop offset="60%" style="stop-color:#7dd3fc;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#38bdf8;stop-opacity:0.07"/>
      <stop offset="80%" style="stop-color:#7dd3fc;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="320" fill="url(#sky)" rx="14"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="45" cy="18" r="0.8" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="12" r="1.1" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="22" r="0.7" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="8" r="1.0" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="18" r="0.6" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="10" r="0.9" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="20" r="0.7" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="7" r="1.2" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="15" r="0.8" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="25" r="0.6" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="11" r="1.0" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="19" r="0.7" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="74" cy="35" r="0.5" opacity="0.5"/>
    <circle cx="155" cy="42" r="0.6" opacity="0.6"/>
    <circle cx="240" cy="38" r="0.5" opacity="0.5"/>
    <circle cx="380" cy="32" r="0.7" opacity="0.7"/>
    <circle cx="460" cy="44" r="0.5" opacity="0.5"/>
    <circle cx="610" cy="38" r="0.6" opacity="0.6"/>
    <circle cx="680" cy="30" r="0.5" opacity="0.5"/>
    <circle cx="820" cy="40" r="0.6" opacity="0.6"/>
    <circle cx="870" cy="32" r="0.5" opacity="0.5"/>
  </g>

  <!-- Aurora bands -->
  <rect x="0" y="40" width="900" height="30" fill="url(#aurora1)" rx="20">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="60" width="900" height="25" fill="url(#aurora2)" rx="15">
    <animate attributeName="opacity" values="1;0.4;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Far background mountains (deep navy) -->
  <polygon points="0,220 60,140 120,170 180,120 260,155 320,105 400,140 460,95 540,130 600,100 660,135 720,110 800,145 860,118 900,140 900,320 0,320"
           fill="#0d2847" opacity="0.9"/>

  <!-- Mid mountains (steel blue) -->
  <polygon points="0,260 50,190 110,215 170,175 230,200 300,160 370,188 430,155 490,178 560,148 630,172 690,145 760,168 820,150 880,165 900,158 900,320 0,320"
           fill="#1a4a7a" opacity="0.95"/>



  <!-- Foreground mountains (darker blue) -->
  <polygon points="0,290 40,245 90,265 140,235 200,258 260,225 330,248 400,220 470,242 530,215 590,238 650,210 710,232 770,208 840,228 900,212 900,320 0,320"
           fill="#0f3460" opacity="1"/>





  <!-- Main name text -->
  <text x="450" y="108"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="44"
        font-weight="300"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#nameGlow)"
        letter-spacing="8">
    Sameerjeet S. Chhabra
  </text>

  <!-- Thin divider under name -->
  <line x1="280" y1="118" x2="620" y2="118" stroke="#7dd3fc" stroke-width="0.6" opacity="0.6"/>

  <!-- Role subtitle -->
  <text x="450" y="140"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13"
        font-weight="400"
        text-anchor="middle"
        fill="#bae6fd"
        letter-spacing="5">
    Robotics &amp; Automation Engineer
  </text>

  <!-- Tag pills -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400">
    <rect x="118" y="155" width="106" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="171" y="167" text-anchor="middle" fill="#e0f2fe">Legged Locomotion</text>

    <rect x="234" y="155" width="80" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="274" y="167" text-anchor="middle" fill="#e0f2fe">MPC Control</text>

    <rect x="324" y="155" width="78" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="363" y="167" text-anchor="middle" fill="#e0f2fe">Sim-to-Real</text>

    <rect x="412" y="155" width="82" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="453" y="167" text-anchor="middle" fill="#e0f2fe">Sensor Fusion</text>

    <rect x="504" y="155" width="82" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="545" y="167" text-anchor="middle" fill="#e0f2fe">Deep Learning</text>

    <rect x="596" y="155" width="88" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="640" y="167" text-anchor="middle" fill="#e0f2fe">Computer Vision</text>

    <rect x="694" y="155" width="88" height="18" rx="9" fill="#ffffff12" stroke="#ffffff30" stroke-width="0.6"/>
    <text x="738" y="167" text-anchor="middle" fill="#e0f2fe">ROS2 · MuJoCo</text>
  </g>

  <!-- Info bar overlay -->
  <rect x="0" y="248" width="900" height="52" fill="#000000" opacity="0.35"/>
  <line x1="0" y1="248" x2="900" y2="248" stroke="#7dd3fc" stroke-width="0.5" opacity="0.35"/>

  <!-- Info text -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="267" font-size="10" fill="#bae6fd" letter-spacing="1">M.S. Robotics & Autonomous Systems  ·  Arizona State University  ·  GPA 3.78</text>
    <text x="40" y="285" font-size="10" fill="#ffffff80" letter-spacing="0.5">Mesa, AZ  ·  Open to Relocation  ·  Graduating May 2026</text>

    <text x="860" y="267" font-size="10" fill="#bae6fd" letter-spacing="0.5" text-anchor="end">Honeywell Hackathon 3rd · $2,500</text>
    <text x="860" y="285" font-size="10" fill="#ffffff80" letter-spacing="0.5" text-anchor="end">LANL Hackathon 2nd · $5,000</text>
  </g>

  <!-- Subtle scan line -->
  <rect x="0" y="0" width="900" height="3" fill="#7dd3fc" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" from="0,-3" to="0,323" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
